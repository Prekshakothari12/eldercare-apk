e:14px;font-weight:600;white-space:nowrap}.badge.success{background:var(--success-light);color:var(--success)}.badge.warning{background:var(--warning-light);color:var(--warning)}.badge.danger{background:var(--danger-light);color:var(--danger)}.badge.blue{background:var(--primary-light);color:var(--primary-dark)}.btn{min-height:44px;border:0;border-radius:12px;padding:10px 16px;font-weight:600;transition:.15s}.btn:active{transform:scale(.97)}.btn-primary{background:var(--primary);color:#fff}.btn-secondary{background:#fff;color:var(--primary);border:2px solid var(--primary)}.btn-danger{background:var(--danger);color:#fff;border-radius:999px}.btn-ghost{background:transparent;color:var(--primary)}.form-field{display:grid;gap:6px}.form-field label{font-weight:500;font-size:16px}.form-field input,.form-field select,.form-field textarea{width:100%;min-height:44px;border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff}.form-field textarea{min-height:90px}.empty{text-align:center;padding:24px 16px;color:var(--text-secondary)}.empty-icon{width:64px;height:64px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--accent-text);background:var(--accent-light)}.empty h2{margin:0 0 8px;color:var(--text-primary);font-size:18px}.empty p{margin:0 0 16px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat strong{display:block;font-size:24px;color:var(--primary);font-weight:600}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:#fff;border-top:1px solid var(--border)}.bottom-nav button{display:flex;flex:1;max-width:180px;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:#fff;padding:6px 4px;color:var(--text-secondary);font-size:14px}.bottom-nav button i{font-size:22px}.bottom-nav button.active{color:var(--primary);font-weight:700}.bottom-nav button.active i{padding:4px 12px;border-radius:999px;background:var(--primary-light)}.toast{position:fixed;top:64px;right:12px;max-width:calc(100vw - 24px);z-index:10000;padding:14px 18px;border-radius:12px;color:#fff;background:var(--success);box-shadow:var(--elevated)}.toast.error{background:var(--danger)}@keyframes page-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:650px){.stats{gap:8px}.topbar{padding:8px 12px}}

.modal-handle{width:48px;height:5px;border-radius:5px;background:#bbb;margin:0 auto 18px}.alert-banner{background:var(--danger);color:#fff;padding:16px;border-radius:12px;animation:pulse 2s infinite}.progress{height:10px;background:#eee;border-radius:9px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--success)}.list-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--primary-light);color:var(--primary-dark);font-weight:700}.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px}.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.35)}50%{box-shadow:0 0 0 10px rgba(211,47,47,0)}}

/* === senior.css === */
/* Senior mode: teal header, quick-access tiles, bottom tab bar, SOS above the tab bar. */
.senior-mode{font-family:"Atkinson Hyperlegible","Noto Sans Devanagari",sans-serif;background:var(--senior-bg);color:var(--senior-text);font-size:var(--fs-base);line-height:1.45;overflow-x:clip}
.senior-mode .page{max-width:520px;margin:0 auto;min-width:0;padding:0 0 calc(72px + 72px + 28px)}
.senior-mode p,.senior-mode a,.senior-mode button{font-size:var(--fs-base)}
.senior-mode h1,.senior-mode h2{font-size:var(--fs-title);line-height:1.2;margin:0 0 .4rem}
.senior-mode .container{padding:16px}
.senior-mode .card{padding:1rem;border-radius:16px;box-shadow:var(--shadow)}

/* header (leaves room on the right for the fixed language switcher) */
.senior-header{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:14px 16px 16px;max-width:520px;margin:0 auto;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-radius:0 0 20px 20px;box-shadow:0 4px 16px rgba(13,148,136,.25)}
.senior-header .greeting{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;line-height:1.25}
.senior-header .greeting small{font-size:calc(var(--fs-base) * .78);opacity:.9;font-weight:500}
.senior-header .greeting strong{font-size:calc(var(--fs-base) * 1.15);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.senior-header .greeting .sub{font-size:calc(var(--fs-base) * .72);opacity:.85}
.senior-mode .page{padding-top:72px}
.senior-actions{display:flex;gap:.4rem;flex:0 0 auto}
.senior-mode .icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:#fff;color:var(--primary);font-size:1rem;font-weight:700;display:grid;place-items:center;padding:0}

/* hero: next medicine */
.senior-mode .hero-card{display:flex;align-items:center;gap:14px;margin-bottom:6px;padding:18px;border-radius:20px;background:linear-gradient(135deg,#ECFEFF,var(--primary-light));box-shadow:var(--shadow)}
.senior-mode .hero-ic{width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:1.5rem}
.senior-mode .hero-card small{display:block;font-size:calc(var(--fs-base) * .75);color:var(--text-secondary)}
.senior-mode .hero-card h2{margin:2px 0;font-size:calc(var(--fs-base) * 1.1)}
.senior-mode .hero-card p{margin:0;font-size:calc(var(--fs-base) * .85);color:var(--text-secondary)}

.senior-mode .section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:700;font-size:calc(var(--fs-base) * 1.05)}
.senior-mode .section-head a{font-size:calc(var(--fs-base) * .78);font-weight:600;color:var(--primary);text-decoration:none;cursor:pointer}

/* quick access tiles */
.senior-mode .grid-home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.senior-mode .home-tile{min-width:0;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:var(--text-primary);font-weight:700}
.senior-mode .home-tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.3rem}

.senior-mode .home-tile small{display:block;margin-top:2px;font-size:calc(var(--fs-base) * .7);font-weight:400;color:var(--text-secondary)}
.senior-mode .home-tile.sn-tile{grid-column:1/-1;flex-direction:row;align-items:center}
.t1{background:#CCFBF1;color:#0F766E}.t2{background:#FEE2E2;color:#DC2626}.t3{background:#DBEAFE;color:#2563EB}.t4{background:#FEF3C7;color:#D97706}

/* today's medicines */
.senior-mode .med{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.senior-mode .med:first-child{padding-top:0}.senior-mode .med:last-child{border-bottom:0;padding-bottom:0}
.senior-mode .med .mi{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;background:#FEE2E2;color:#DC2626}

.senior-mode .badge{font-size:calc(var(--fs-base) * .68)}
.badge.grey{background:#F1F5F9;color:var(--text-secondary)}

/* food guidance */
.senior-mode .food-row{padding:12px;border-radius:12px;font-size:calc(var(--fs-base) * .85)}

.senior-mode .food-row .label{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-weight:700;font-size:calc(var(--fs-base) * .72);text-transform:uppercase;letter-spacing:.5px}
.senior-mode .food-eat{background:var(--success-light);color:#166534}

/* bottom tab bar */
.senior-nav{max-width:520px;left:50%;right:auto;width:100%;transform:translateX(-50%);height:72px;border-top:0;border-radius:20px 20px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.1);padding:0 4px}

ard-title{display:flex;align-items:center;gap:8px}.caregiver-mode .card-title i{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--primary-light)}@keyframes skeleton{to{background-position:-200% 0}}@media(max-width:360px){.caregiver-mode .container{padding:16px 12px}.caregiver-mode .stats{gap:6px}.caregiver-mode .stat{padding:10px 8px}}
/* Match the senior look: teal gradient header and rounded tab bar */
.caregiver-mode .caregiver-bar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));border-bottom:0;border-radius:0 0 20px 20px;color:#fff}
.caregiver-mode .caregiver-bar .logo{color:#fff}
.caregiver-mode .caregiver-bar .logo-mark{background:#fff;color:var(--primary)}
.caregiver-mode .icon-button{background:#fff}
.caregiver-mode .caregiver-bar .avatar{background:#fff;color:var(--primary-dark)}
.caregiver-mode .bottom-nav{border-top:0;border-radius:20px 20px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.1)}
.caregiver-mode .bottom-nav button{min-width:0;padding:6px 2px;font-size:12px}
.caregiver-mode .hero{border-left:0;background:linear-gradient(135deg,#ECFEFF,var(--primary-light))}

/* === login.css === */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
  background:linear-gradient(165deg,#CCFBF1 0%,#F1F5F9 45%,#FEF3E2 100%);
}
.login-wrap{width:100%;max-width:420px}
.login-wrap .brand{text-align:center;margin-bottom:20px}
.login-wrap .brand img{width:72px;height:72px;margin-bottom:8px}
.login-wrap .brand h1{margin:0;font-size:1.75rem;color:var(--primary-dark)}
.login-wrap .brand p{margin:6px 0 0;color:var(--text-secondary)}
.auth-card{
  background:var(--surface);
  border-radius:20px;
  padding:22px 18px;
  box-shadow:var(--elevated);
}
.auth-panel h2{margin:0 0 14px;font-size:1.25rem}
.role-selector,.signup-roles{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}
.role-button,.signup-role{
  border:1px solid var(--border);
  background:#fff;
  border-radius:14px;
  padding:12px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  font-size:.85rem;
  font-weight:600;
  color:var(--text-secondary);
}
.role-button i,.signup-role i{font-size:1.25rem;color:var(--primary)}
.role-button.active,.signup-role.active{
  border-color:var(--primary);
  background:var(--primary-light);
  color:var(--primary-dark);
}
.login-form .form-field{margin-bottom:12px}
.login-form label{display:block;margin-bottom:6px;font-weight:600;font-size:var(--fs-label)}
.login-form input{
  width:100%;
  min-height:48px;
  padding:10px 12px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#fff;
}
.phone-input{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 12px;
  background:#fff;
  min-height:48px;
}
.phone-input span{font-weight:600;color:var(--text-secondary);white-space:nowrap}
.phone-input input{border:0;padding:10px 0;min-height:44px;outline:none}
.login-submit{width:100%;min-height:52px;margin-top:8px}
.login-error{
  margin:8px 0;
  padding:10px 12px;
  border-radius:12px;
  background:var(--danger-light);
  color:var(--danger);
  font-size:.9rem;
}
.auth-links{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:14px;
  align-items:stretch;
}
.auth-links .btn{width:100%}
.btn-ghost{
  background:transparent;
  border:0;
  color:var(--primary);
  font-weight:600;
  min-height:44px;
}
.btn-primary{
  background:var(--primary);
  color:#fff;
  border:0;
  border-radius:14px;
  font-weight:700;
  padding:12px 16px;
}
.btn-secondary{
  background:var(--primary-light);
  color:var(--primary-dark);
  border:0;
  border-radius:14px;
  font-weight:600;
  padding:10px 14px;
}
.floating-sos{
  position:fixed;
  right:16px;
  bottom:96px;
  z-index:999;
  min-width:72px;
  min-height:72px;
  border-radius:50%;
  border:0;
  background:var(--danger);
  color:#fff;
  box-shadow:0 8px 24px rgba(220,38,38,.35);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  font-weight:700;
  font-size:.85rem;
}
.floating-sos i{font-size:1.35rem}
.alert-banner{
  background:var(--danger-light);
  border:1px solid var(--danger);
  color:var(--text-primary);
  border-radius:14px;
  padding:12px 14px;
  margin:12px 16px;
}
.community-room:active{transform:scale(.98)}
.food-list{margin:8px 0 0;padding-left:1.2rem}
.food-list li{margin:4px 0}
#sos-slot{position:sticky;top:0;z-index:20}

/* SOS + low-stock in-app banners */
.sos-slot-fixed{position:sticky;top:0;z-index:1000;padding:8px 12px 0}
.sos-banner,.low-stock-banner{
  background:#FEF2F2;
  border:1px solid #FECACA;
  border-radius:14px;
  padding:12px 14px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
}
.low-stock-banner{background:#FFFBEB;border-color:#FDE68A}
.sos-banner-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sos-dismiss{
  border:0;background:transparent;font-size:1.4rem;line-height:1;
  min-width:36px;min-height:36px;color:var(--text-secondary);cursor:pointer
}
.med-detail p{margin:6px 0}
.record-card img{background:#f1f5f9}
.modal{max-height:85dvh;overflow:auto;height:auto}


/* === Mobile app shell === */
html,body{
  max-width:480px;
  margin-left:auto;
  margin-right:auto;
  background:#0f172a;
}
body{
  min-height:100dvh;
  background:var(--bg);
  box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 0 40px rgba(0,0,0,.12);
}
#app, #login-screen{
  min-height:100dvh;
  max-width:480px;
  margin:0 auto;
}
.bottom-nav{
  max-width:480px;
  left:50%;
  transform:translateX(-50%);
  padding-bottom:env(safe-area-inset-bottom, 0);
  height:64px;
}
.floating-sos{
  right: max(16px, calc(50% - 220px));
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
}
.sos-slot-fixed{position:static;padding:0;margin:0 0 12px}
.sos-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sos-actions .btn{flex:1 1 auto;min-width:120px;justify-content:center;text-align:center}
.btn-maps{background:#FEF3C7!important;color:#B45309!important;border:0!important;font-weight:700}
.sos-senior-modal{text-align:center;padding-bottom:28px}
.sos-pulse{
  width:72px;height:72px;margin:8px auto 16px;border-radius:50%;
  background:var(--danger);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:1.1rem;
  animation:sos-pulse 1.2s ease infinite;
}
.sos-pulse.ok{background:var(--success);animation:none}
@keyframes sos-pulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(220,38,38,.45)}
  50%{transform:scale(1.05);box-shadow:0 0 0 14px rgba(220,38,38,0)}
}
.modal-backdrop{align-items:flex-end}
@media(min-width:481px){
  .modal-backdrop{align-items:center}
  .modal{border-radius:24px 24px 0 0;margin:0;max-width:100%;width:100%}
}
/* Larger touch targets */
.btn,.role-button,.signup-role,.bottom-nav button,.home-tile{
  -webkit-tap-highlight-color:transparent;
}
.bottom-nav button{min-height:56px;font-size:12px}
.bottom-nav button i{font-size:20px}
.senior-mode .home-tile{min-height:96px}
.container{padding:12px 14px 24px}
.topbar,.senior-header{padding-left:14px;padding-right:14px}
/* Phone frame feel on desktop preview */
@media(min-width:520px){
  body{padding:12px 0;background:#0f172a}
  #login-screen,#app{border-radius:24px;overflow:hidden;min-height:calc(100dvh - 24px)}
}

.sos-coords{margin:6px 0 10px;font-size:0.95rem;color:var(--text-primary)}
.sos-coords i{color:var(--danger);margin-right:4px}

.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip-check{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:#f1f5f9;font-size:0.9rem;cursor:pointer}
.chip-check input{width:18px;height:18px}
.family-quick.grid-home{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.family-quick .home-tile{border:0;background:#fff;border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:8px}
.food-eat-card h2 i{margin-right:6px;color:var(--success)}
.sos-coords{font-weight:600}

<section id="login-screen">
